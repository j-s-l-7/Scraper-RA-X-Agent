# Technical, ownership, regime feature map (05 §6, 01 §2.5/2.6/3.6). Owner: P3. Same keys as features_fundamental.yaml, plus:
#   trainable_from  first anchor at which the builder emits a value (earlier anchors are masked to NaN, 01 P3 #4).
# Sets (tactical): tech = T0 price/volume columns; t1 = short-history columns (delivery, FPI sector flow, ownership,
# events); regime = broadcast regime and macro columns. T0 = tech, T0_regime = tech + regime, T1 = tech + t1.
# No column is in the P2 sets (core/ext/shown), so the 1Y core matrix never picks a P3 column by accident.
version: 1

features:
  # -- T0 price / volume (set: tech) --
  mom_1m: {family: mom_short, prior: -1, kind: cross_sectional, category: momentum, set: tech, trainable_from: 2010-07-01}
  mom_3m: {family: mom, prior: 1, kind: cross_sectional, category: momentum, set: tech, trainable_from: 2010-07-01}
  mom_6m: {family: mom, prior: 1, kind: cross_sectional, category: momentum, set: tech, trainable_from: 2010-07-01}
  mom_12_1: {family: mom, prior: 1, kind: cross_sectional, category: momentum, set: tech, trainable_from: 2011-02-01}
  rev_5d: {family: mom_short, prior: -1, kind: cross_sectional, category: reversal, set: tech, trainable_from: 2010-02-01}
  rs_grp_3m: {family: rs_grp, prior: 1, kind: cross_sectional, category: relative_strength, set: tech, trainable_from: 2010-07-01}
  rs_grp_6m: {family: rs_grp, prior: 1, kind: cross_sectional, category: relative_strength, set: tech, trainable_from: 2010-07-01}
  rs_n500_3m: {family: rs_n500, prior: 1, kind: cross_sectional, category: relative_strength, set: tech, trainable_from: 2010-07-01}
  rs_n500_6m: {family: rs_n500, prior: 1, kind: cross_sectional, category: relative_strength, set: tech, trainable_from: 2010-07-01}
  dist_52wh: {family: dist52, prior: 1, kind: cross_sectional, category: trend, set: tech, trainable_from: 2011-01-01}
  dist_52wl: {family: dist52, prior: null, kind: cross_sectional, category: trend, set: tech, trainable_from: 2011-01-01}
  brk_1y: {family: brk, prior: 1, kind: cross_sectional, category: breakout, set: tech, trainable_from: 2011-01-01}
  brk_2y: {family: brk, prior: 1, kind: cross_sectional, category: breakout, set: tech, trainable_from: 2012-01-01}
  brk_3_4y: {family: brk, prior: 1, kind: cross_sectional, category: breakout, set: tech, trainable_from: 2014-01-01}
  brkdn_1y: {family: brkdn, prior: -1, kind: cross_sectional, category: breakout, set: tech, trainable_from: 2011-01-01}
