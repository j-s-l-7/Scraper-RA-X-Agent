  ma200_gap: {family: ma, prior: 1, kind: cross_sectional, category: trend, set: tech, trainable_from: 2010-11-01}
  ma50_200: {family: ma, prior: 1, kind: cross_sectional, category: trend, set: tech, trainable_from: 2010-11-01}
  rvol_63: {family: vol, prior: -1, kind: cross_sectional, category: risk, set: tech, trainable_from: 2010-04-01}
  dvol_63: {family: vol, prior: -1, kind: cross_sectional, category: risk, set: tech, trainable_from: 2010-04-01}
  beta_252: {family: beta, prior: null, kind: cross_sectional, category: risk, set: tech, trainable_from: 2011-01-01}
  idio_vol: {family: vol, prior: -1, kind: cross_sectional, category: risk, set: tech, trainable_from: 2011-01-01}
  liq_rank: {family: liq, prior: null, kind: cross_sectional, category: liquidity, set: tech, trainable_from: 2010-07-01}
  max_21: {family: lottery, prior: -1, kind: cross_sectional, category: risk, set: tech, trainable_from: 2010-02-01}
  skew_126: {family: lottery, prior: -1, kind: cross_sectional, category: risk, set: tech, trainable_from: 2010-07-01}
  id_frog: {family: id_frog, prior: -1, kind: cross_sectional, category: momentum, set: tech, trainable_from: 2011-01-01}
  amihud_63: {family: liq, prior: null, kind: cross_sectional, category: liquidity, set: tech, trainable_from: 2010-04-01}
  updown_vol_63: {family: volume, prior: 1, kind: cross_sectional, category: volume, set: tech, trainable_from: 2010-04-01}
  rrg_ratio_grp: {family: rrg, prior: 1, kind: cross_sectional, category: rotation, set: tech, trainable_from: 2011-09-01}
  rrg_mom_grp: {family: rrg, prior: 1, kind: cross_sectional, category: rotation, set: tech, trainable_from: 2011-09-01}
  rrg_quad_grp: {family: rrg_q, prior: null, kind: cross_sectional, category: rotation, set: tech, trainable_from: 2011-09-01}
