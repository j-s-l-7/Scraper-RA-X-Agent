  regime_iip_yoy: {family: regime_macro, prior: null, kind: broadcast, category: regime, set: regime, trainable_from: 2011-01-01}
  regime_usdinr_3m: {family: regime_macro, prior: null, kind: broadcast, category: regime, set: regime, trainable_from: 2011-01-01}
